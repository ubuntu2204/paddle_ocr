name: Publish pp_ocr

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - env:
          PUB_CREDENTIALS_B64: ${{ secrets.PUB_CREDENTIALS_B64 }}
        run: |
          mkdir -p ~/.config/dart
          printf '%s' "$PUB_CREDENTIALS_B64" | base64 -d > ~/.config/dart/pub-credentials.json
          chmod 600 ~/.config/dart/pub-credentials.json
          echo "credential_bytes=$(wc -c < ~/.config/dart/pub-credentials.json)"
      - name: Publish
        run: |
          set -o pipefail
          dart pub publish --force 2>&1 | tee /tmp/publish.log
          status=${PIPESTATUS[0]}
          {
            echo '### pub publish output'
            echo '```'
            tail -60 /tmp/publish.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
