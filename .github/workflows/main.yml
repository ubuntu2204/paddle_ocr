name: Publish pp_ocr
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - env:
          PUB_CREDENTIALS_B64: ${{ secrets.PUB_CREDENTIALS_B64 }}
        run: |
          mkdir -p ~/.config/dart
          printf '%s' "$PUB_CREDENTIALS_B64" | base64 -d > ~/.config/dart/pub-credentials.json
          chmod 600 ~/.config/dart/pub-credentials.json
      - run: dart pub publish --force
