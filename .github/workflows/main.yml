name: Publish pp_ocr

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pp_ocr 依赖 Flutter SDK，只有 Dart SDK 时 dart pub 无法解析依赖。
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
      - env:
          PUB_CREDENTIALS_B64: ${{ secrets.PUB_CREDENTIALS_B64 }}
        run: |
          mkdir -p ~/.config/dart
          printf '%s' "$PUB_CREDENTIALS_B64" | base64 -d > ~/.config/dart/pub-credentials.json
          chmod 600 ~/.config/dart/pub-credentials.json
      - run: flutter pub publish --force
